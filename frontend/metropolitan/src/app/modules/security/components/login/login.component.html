<div class="login-container">
  <div class="bg-layer">
    <image-gallery></image-gallery>
  </div>
  <div class="overlay"></div>
  <div class="login-wrapper">
    <div class="glass-card">
      <div class="card-brand">
        <div class="brand-icon">
          <i nz-icon nzType="bank" nzTheme="outline"></i>
        </div>
        <h1>Metropolitana</h1>
        <p class="brand-sub">Sistema de Gestión</p>
      </div>
      <nz-spin [nzSpinning]="waitAction">
        <form nz-form [formGroup]="form" class="login-form">
          <nz-form-item>
            <nz-form-control>
              <nz-input-group nzPrefixIcon="user">
                <input nz-input name="usuario" type="text" formControlName="usuario" placeholder="Usuario">
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-control>
              <nz-input-group nzPrefixIcon="lock">
                <input nz-input name="password" type="password" formControlName="password" placeholder="Contraseña">
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <button nz-button nzType="primary" nzSize="large" (click)="login()" nzBlock>
            Ingresar
          </button>
        </form>
      </nz-spin>
      <div class="card-footer">
        <p>&copy; 2025 Metropolitana</p>
      </div>
    </div>
  </div>
</div>

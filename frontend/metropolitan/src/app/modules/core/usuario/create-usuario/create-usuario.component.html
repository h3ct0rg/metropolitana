<div class="page-header">
  <h2>{{ isEdit ? 'Editar Usuario' : 'Crear Usuario' }}</h2>
</div>

<div class="glass-card form-card">
  <form nz-form [formGroup]="form">
    <h4>Datos Generales</h4>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzFor="nombre">Nombre</nz-form-label>
          <nz-form-control>
            <input nz-input name="nombre" type="text" formControlName="nombreUsuario">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzFor="ci">CI</nz-form-label>
          <nz-form-control>
            <input nz-input name="ci" type="text" formControlName="ciUser">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzFor="email">Email</nz-form-label>
          <nz-form-control>
            <input nz-input name="Email" type="text" formControlName="emailUser">
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <h4>Credenciales de Acceso</h4>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzFor="usuario">Nombre de Usuario</nz-form-label>
          <nz-form-control>
            <input nz-input name="usuario" type="text" formControlName="usuarioUser">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzFor="password">Password</nz-form-label>
          <nz-form-control>
            <input nz-input name="password" type="password" formControlName="passwordUser">
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <ng-container *ngIf="isAdmin">
      <h4>Permisos</h4>
      <div nz-row [nzGutter]="24">
        <div nz-col [nzXs]="24" [nzMd]="12">
          <nz-form-item>
            <nz-form-label nzRequired>Roles</nz-form-label>
            <nz-form-control>
              <nz-select style="width:100%" nzMode="tags" nzPlaceHolder="Role de Sistema" formControlName="selectRol">
                <nz-option *ngFor="let option of idroles" [nzLabel]="option['name']" [nzValue]="option['id']"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzXs]="24" [nzMd]="12">
          <nz-form-item>
            <nz-form-label nzRequired>Sucursal</nz-form-label>
            <nz-form-control>
              <nz-select style="width:100%" nzPlaceHolder="Sucursal" formControlName="sucursal">
                <nz-option *ngFor="let option of listSucursales" [nzLabel]="option['nombre']" [nzValue]="option['id']"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </ng-container>

    <div class="form-actions">
      <button nz-button nzType="default" (click)="cancel()">Cancelar</button>
      <button nz-button nzType="primary" (click)="saveProveedor()">Guardar Datos de Usuario</button>
    </div>
  </form>
</div>

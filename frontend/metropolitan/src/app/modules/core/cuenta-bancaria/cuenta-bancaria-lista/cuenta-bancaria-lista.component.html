<div nz-row>
  <div nz-col nzSpan="8"><h2>Cuentas Bancarias</h2></div>
  <div nz-col nzSpan="8">
    <button nz-button nzType="primary" routerLink="cuentaBancariaCreate">Crear Cuenta Bancaria</button>
  </div>
</div>

<nz-spin [nzSpinning]="waitAction">
  <nz-table #basicTable [nzData]="listOfData">
    <thead>
      <tr>
        <th>Nombre</th><th>Moneda</th><th>Activo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of listOfData" routerLink="cuentaBancariaEdit/{{data.id}}">
        <td>{{ data.nombre }}</td>
        <td>{{ data.moneda }}</td>
        <td>{{ data.activo ? 'Activo' : 'Inactivo' }}</td>
      </tr>
    </tbody>
  </nz-table>
</nz-spin>

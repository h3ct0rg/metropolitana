<div class="page-header">
  <h2>{{ isEdit ? 'Editar Forma de Pago' : 'Nueva Forma de Pago' }}</h2>
</div>

<div class="glass-card form-card">
  <form nz-form [formGroup]="form">
    <h4>Datos Generales</h4>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzXs]="24" [nzMd]="10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="nombre">Nombre</nz-form-label>
          <nz-form-control>
            <input nz-input name="nombre" type="text" formControlName="nombre" placeholder="Ej. Efectivo Dólares">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="moneda">Moneda</nz-form-label>
          <nz-form-control>
            <nz-select style="width:100%" formControlName="moneda">
              <nz-option nzValue="USD" nzLabel="Dólares (USD)"></nz-option>
              <nz-option nzValue="BS" nzLabel="Bolivianos (BS)"></nz-option>
              <nz-option nzValue="AMBOS" nzLabel="Ambos / depende de la cuenta"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="6">
        <nz-form-item>
          <nz-form-label nzFor="orden">Orden en el listado</nz-form-label>
          <nz-form-control>
            <input nz-input name="orden" type="number" formControlName="orden">
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <h4>Áreas donde aplica</h4>
    <div nz-row [nzGutter]="16">
      <div nz-col [nzXs]="24" [nzMd]="8">
        <label class="option-card" nz-checkbox formControlName="areaTravelace">Travelace (UA)</label>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <label class="option-card" nz-checkbox formControlName="areaPaquetes">Paquetes</label>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="8">
        <label class="option-card" nz-checkbox formControlName="areaCarga">Carga</label>
      </div>
    </div>

    <h4>Configuración Adicional</h4>
    <div nz-row [nzGutter]="16">
      <div nz-col [nzXs]="24" [nzMd]="12">
        <label class="option-card" nz-checkbox formControlName="requiereCuentaBancaria">Requiere elegir una cuenta bancaria</label>
      </div>
      <div nz-col [nzXs]="24" [nzMd]="12">
        <label class="option-card" nz-checkbox formControlName="activo">Activo (seleccionable en nuevas ND/OP)</label>
      </div>
    </div>

    <div class="form-actions">
      <button nz-button nzType="default" (click)="cancel()">Cancelar</button>
      <button nz-button nzType="primary" [disabled]="!form.valid" (click)="saveFormaPago()">Guardar Forma de Pago</button>
    </div>
  </form>
</div>

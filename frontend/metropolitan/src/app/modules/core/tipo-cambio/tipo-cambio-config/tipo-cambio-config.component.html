<h2>Tipo de Cambio (USD → Bs)</h2>

<div nz-row style="padding-bottom:20px;">
  <div nz-col nzSpan="24">
    <strong>Valor actual:</strong> {{ valorActual }} Bs por USD
  </div>
</div>

<form nz-form [formGroup]="form">
  <div nz-row>
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="valor">Nuevo tipo de cambio</nz-form-label>
        <nz-form-control>
          <input nz-input name="valor" type="number" step="0.01" formControlName="valor" nzSpan="20">
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" style="padding-top:38px;">
      <button nz-button [disabled]="!form.valid" nzType="primary" (click)="guardarTipoCambio()">Fijar Nuevo Tipo de Cambio</button>
    </div>
  </div>
</form>

<nz-spin [nzSpinning]="waitAction">
  <h3>Historial</h3>
  <nz-table #basicTable [nzData]="historial">
    <thead>
      <tr>
        <th>Valor</th><th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of historial">
        <td>{{ data.valor }}</td>
        <td>{{ data.createDate | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </tbody>
  </nz-table>
</nz-spin>

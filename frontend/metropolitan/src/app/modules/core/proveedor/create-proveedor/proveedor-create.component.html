<h2>Crear Cliente</h2>

<form nz-form [formGroup]="form">
  <div class="gutter-example">
    <div nz-row>
      <div nz-col class="gutter-row" nzSpan="8">
        <nz-form-item>
          <nz-form-label nzSpan="4" nzFor="nombre">Nombre</nz-form-label>
          <nz-form-control nzSpan="16">
            <input nz-input name="nombre" type="text" formControlName="nombreProveedor" nzSpan="20">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col class="gutter-row" nzSpan="8">
        <nz-form-item>
          <nz-form-label nzSpan="4" nzFor="telefono">Telefono</nz-form-label>
          <nz-form-control nzSpan="16">
            <input nz-input name="telefono" type="text" formControlName="telefonoProveedor" nzSpan="20">
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col class="gutter-row" nzSpan="8">
        <nz-form-item>
          <nz-form-label nzSpan="4" nzFor="fax">Direccion</nz-form-label>
          <nz-form-control nzSpan="16">
            <input nz-input name="fax" type="text" formControlName="direccionProveedor" nzSpan="20">
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </div>
</form>

<div nz-row>
  <div nz-col nzSpan="24" nzOffset="9">
    <button nz-button nzType="primary" (click)="saveProveedor()">Guardar Datos de Proveedor</button>
  </div>
</div>
